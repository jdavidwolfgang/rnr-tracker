<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R&amp;R Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee;--panel:#ffffff;--ink:#1f2328;--muted:#6a6e75;--line:#e2ded4;--line2:#cfc9bc;
  --accent:#1e4d6b;--accent-soft:#e3edf3;--done:#2e6a3e;--done-soft:#eaf3ec;
  --warn:#8f5700;--warn-soft:#fbf0db;--danger:#a3312a;--danger-soft:#f8e3e1;
  --w1:#6f9fbf;--w2:#d39b2f;--w3:#bf4f3b;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16181b;--panel:#1f2226;--ink:#e7e5e0;--muted:#9a9ea5;--line:#30343a;--line2:#454a52;
    --accent:#7fb2d4;--accent-soft:#1f3442;--done:#8fcb9c;--done-soft:#1d2e22;--warn:#e7b562;--warn-soft:#3a2e17;--danger:#ef8a80;--danger-soft:#3d2020;}
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:14px/1.45 Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 12px;white-space:nowrap}
button:hover{border-color:var(--line2)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){button.primary{color:#0f1a22}}
button.danger{color:var(--danger)}
button.danger:hover{border-color:var(--danger)}
button.link{border:none;background:none;padding:4px 2px;color:var(--accent)}
button.small{padding:4px 9px;font-size:12px}
input,textarea,select{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
select{width:auto}
textarea{resize:vertical;min-height:70px;line-height:1.45;overflow:hidden}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
label{font-size:13px}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif;font-weight:600;margin:0}
h1{font-size:28px}
.muted{color:var(--muted)}
.hidden{display:none!important}

/* Lock */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px}
.lock-card p{margin:0;color:var(--muted)}
.lock-card label{display:flex;flex-direction:column;gap:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chkline{display:flex!important;flex-direction:row!important;align-items:center;gap:8px}
.chkline input{width:auto}
.err{color:var(--danger);min-height:1em}

/* Header */
header.top{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 20px;flex-wrap:wrap}
.brand{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:18px;cursor:pointer}
.crumb{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:40vw}
.spacer{flex:1}
.pill{font-size:12px;padding:4px 10px;border-radius:999px;border:none;background:var(--done-soft);color:var(--done)}
.pill.pending,.pill.saving{background:var(--warn-soft);color:var(--warn)}
.pill.error,.pill.conflict{background:var(--danger-soft);color:var(--danger)}
main{max-width:1440px;margin:0 auto;padding:24px 20px 100px}

/* Home */
.home-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.folder{margin-bottom:26px}
.folder-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.folder-h h2{font-size:19px;cursor:pointer}
.folder-h .count{color:var(--muted);font-size:13px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card h3{font-size:17px}
.card .sub{color:var(--muted);font-size:13px}
.card-foot{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-top:4px}
.card-foot select{font-size:12px;padding:3px 6px}
.due{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.due.soon{background:var(--warn-soft);color:var(--warn)}
.due.late{background:var(--danger-soft);color:var(--danger)}
.empty{border:1px dashed var(--line2);border-radius:12px;padding:30px;text-align:center;color:var(--muted)}

.bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--done);border-radius:999px;transition:width .25s}

/* Project */
.proj-head{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.title-input{font-family:'Source Serif 4',Georgia,serif;font-size:28px;font-weight:600;border:1px solid transparent;background:transparent;padding:2px 6px;margin-left:-7px}
.title-input:hover{border-color:var(--line)}
.meta-row{display:flex;gap:12px;flex-wrap:wrap}
.meta-row label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.meta-row input{width:auto}
.meta-row input[data-pf=journal]{width:260px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:10px 14px;color:var(--muted);font-weight:500}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}

.progress-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
.pc-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.big{font-family:'Source Serif 4',Georgia,serif;font-size:38px;font-weight:600;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;padding:5px 11px;font-size:13px;background:var(--panel)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#0f1a22}}
.blend{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:8px 0}
.blend input{width:160px;padding:0}
.stats{font-size:13px;color:var(--muted);margin-top:8px}
.breakdown{display:flex;flex-direction:column;gap:7px}
.bd-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.bd-head select{font-size:12px;padding:2px 6px}
.bd-row{display:grid;grid-template-columns:110px 1fr 70px;align-items:center;gap:8px;font-size:13px}
.bd-row .lab{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bd-row .num{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums}
.bd-row .bar{height:6px}

.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.toolbar label{display:flex;align-items:center;gap:5px;color:var(--muted)}
.toolbar select{padding:5px 6px}
.showing{font-size:13px;color:var(--muted);margin:0 0 8px}

.rows{display:flex;flex-direction:column;gap:10px}
.group-h{font-weight:600;font-size:13px;color:var(--muted);margin:12px 0 0;text-transform:uppercase;letter-spacing:.05em}
.row{display:grid;grid-template-columns:214px repeat(3,minmax(0,1fr));gap:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--w2);border-radius:10px;padding:12px}
.row[data-w="1"]{border-left-color:var(--w1)}
.row[data-w="3"]{border-left-color:var(--w3)}
.row.done{background:var(--done-soft)}
.row.done textarea,.row.done input:not([type=checkbox]){background:transparent}
.row.flash{outline:2px solid var(--accent)}
.meta{display:flex;flex-direction:column;gap:8px}
.pair{display:grid;grid-template-columns:72px 1fr;gap:8px}
.fl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);display:block;margin-bottom:3px}
.complete{display:flex;align-items:center;gap:8px;font-weight:500;cursor:pointer;padding:4px 0}
.complete input{width:18px;height:18px;accent-color:var(--done);margin:0}
.wt{display:flex;gap:4px}
.wt button{flex:1;padding:4px 0;font-size:13px}
.wt button.on[data-w="1"]{background:var(--w1);border-color:var(--w1);color:#fff}
.wt button.on[data-w="2"]{background:var(--w2);border-color:var(--w2);color:#fff}
.wt button.on[data-w="3"]{background:var(--w3);border-color:var(--w3);color:#fff}
.row-foot{display:flex;justify-content:flex-start;margin-top:auto}

/* Letter */
.letter-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:20px;align-items:start}
.letter-controls{display:flex;flex-direction:column;gap:12px}
.letter-controls textarea{min-height:130px}
.opts{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:9px;background:var(--panel)}
.opts legend{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;padding:0 4px}
.opts .two input{width:100%}
.note{font-size:13px;background:var(--warn-soft);color:var(--warn);padding:9px 12px;border-radius:8px}
.paper{background:#fff;color:#141414;font-family:'Times New Roman',Times,serif;font-size:15.5px;line-height:1.5;padding:48px 56px;border:1px solid var(--line);border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.06);position:sticky;top:76px;max-height:calc(100vh - 100px);overflow:auto}
.paper p{margin:0 0 12px}
.paper h3{font-family:'Times New Roman',Times,serif;font-size:15.5px;font-weight:bold;margin:20px 0 10px}
.paper .pending{background:#fff1cc;color:#7a4e00}
.paper .empty-l{color:#888;font-style:italic}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,22,25,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--panel);border-radius:14px;padding:22px;max-width:480px;width:100%;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h2{font-size:20px}
.modal-body{display:flex;flex-direction:column;gap:10px}
.modal-body label{display:flex;flex-direction:column;gap:4px}
.modal-body p{margin:0}
.modal-btns{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:120;font-size:13px}

@media (max-width:1000px){
  .row{grid-template-columns:1fr}
  .letter-grid{grid-template-columns:1fr}
  .paper{position:static;max-height:none;padding:28px 24px}
  .progress-card{grid-template-columns:1fr}
}
@media (max-width:560px){
  main{padding:16px 12px 80px}
  header.top{padding:10px 12px}
  .crumb{display:none}
}
</style>
</head>
<body>

<div id="lock">
  <form class="lock-card" id="lockForm" autocomplete="off">
    <h1>R&amp;R Tracker</h1>
    <p>Your data lives in a private GitHub repository. Unlock with a fine-grained personal access token that has Contents read and write access to that repository.</p>
    <label>Access token<input type="password" id="lkToken" required spellcheck="false"></label>
    <label>Data repository (owner/name)<input id="lkRepo" placeholder="username/rnr-data" required spellcheck="false"></label>
    <div class="two">
      <label>File path<input id="lkPath" value="rnr-tracker.json" spellcheck="false"></label>
      <label>Branch<input id="lkBranch" placeholder="default" spellcheck="false"></label>
    </div>
    <label class="chkline"><input type="checkbox" id="lkRemember" checked> Remember token on this device</label>
    <button class="primary" type="submit" id="lkBtn">Unlock</button>
    <div class="err" id="lkErr"></div>
  </form>
</div>

<div id="app" class="hidden">
  <header class="top">
    <span class="brand" data-act="home">R&amp;R Tracker</span>
    <span class="crumb" id="crumb"></span>
    <span class="spacer"></span>
    <button class="pill" id="syncPill" data-act="sync">Saved</button>
    <button class="small" data-act="backup" title="Download all data as JSON">Backup</button>
    <button class="small" data-act="restore" title="Replace all data from a JSON backup">Restore</button>
    <button class="small" data-act="lock">Lock</button>
  </header>
  <main id="main"></main>
</div>

<input type="file" id="csvFile" accept=".csv,.tsv,.txt,text/csv" hidden>
<input type="file" id="jsonFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const numOf = e => (e.num === null || e.num === undefined || e.num === '' || isNaN(Number(e.num))) ? Infinity : Number(e.num);
const cmpNum = (a, b) => { const x = numOf(a), y = numOf(b); return x === y ? 0 : (x < y ? -1 : 1); };
const cmpStr = (x, y) => {
  x = String(x ?? '').trim(); y = String(y ?? '').trim();
  if (!x && y) return 1; if (x && !y) return -1;
  return x.localeCompare(y, undefined, {numeric: true, sensitivity: 'base'});
};
const W = e => [1, 2, 3].includes(Number(e.weight)) ? Number(e.weight) : 2;
const pct = x => Math.round(x * 100) + '%';
const slug = s => String(s || 'project').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 50) || 'project';
const today = () => new Date().toISOString().slice(0, 10);

function revLabel(r) {
  const v = String(r ?? '').trim();
  if (!v) return 'Unassigned';
  if (/^\d+$/.test(v)) return 'Reviewer ' + v;
  const m = v.match(/^r\s*#?\s*(\d+)$/i);
  if (m) return 'Reviewer ' + m[1];
  return v;
}
function revSortKey(r) { return /editor|^ae$/i.test(String(r || '')) ? '0' : '1' + String(r || '').trim(); }
const cmpRev = (a, b) => cmpStr(revSortKey(a), revSortKey(b));

/* ---------- state ---------- */
const LS_CFG = 'rnr.cfg', LS_PUB = 'rnr.cfg.public', LS_CACHE = 'rnr.cache';
let cfg = null, state = null, sha = null, repoPrivate = true;
let rev = 0, savedRev = 0, saving = false, saveTimer = null, conflict = false, lastSaved = null;
const ui = {view: 'home', projectId: null, tab: 'edits', sort: 'num', dir: 1, fRev: '', fSec: '', fStat: '', breakdown: 'reviewer', collapsed: {}};

function emptyState() { return {version: 1, updated: Date.now(), folders: [], projects: []}; }
function newProject(name, folderId, journal) {
  return {id: uid(), name: name || 'Untitled project', folderId: folderId || null, journal: journal || '', due: '',
    created: Date.now(), updated: Date.now(), progressMode: 'count', blend: 50, intro: '', conclusion: '',
    letter: {includeComment: true, includeSection: false, numbering: 'edit', commentLabel: 'Comment', responseLabel: 'Response'},
    edits: []};
}
function newEdit(o) { return Object.assign({id: uid(), num: null, reviewer: '', section: '', weight: 2, comment: '', action: '', response: '', done: false}, o || {}); }
function normalizeState(s) {
  s = s && typeof s === 'object' ? s : emptyState();
  s.folders = Array.isArray(s.folders) ? s.folders : [];
  s.projects = Array.isArray(s.projects) ? s.projects : [];
  s.projects = s.projects.map(p => {
    const d = newProject();
    const q = Object.assign(d, p);
    q.letter = Object.assign(newProject().letter, p.letter || {});
    q.edits = (Array.isArray(p.edits) ? p.edits : []).map(e => newEdit(e));
    return q;
  });
  return s;
}
const curProject = () => state && state.projects.find(p => p.id === ui.projectId);
const findEdit = id => { const p = curProject(); return p && p.edits.find(e => e.id === id); };

/* ---------- GitHub sync ---------- */
function gh(path, opts = {}) {
  return fetch('https://api.github.com' + path, Object.assign({}, opts, {
    cache: 'no-store',
    headers: Object.assign({'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}, opts.headers || {})
  }));
}
async function errMsg(r) { try { const j = await r.json(); return (j.message || r.statusText) + ' (' + r.status + ')'; } catch (e) { return r.status + ' ' + r.statusText; } }
function b64encode(str) {
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64decode(b64) {
  const bin = atob(String(b64).replace(/\s/g, '')); const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
const contentsUrl = () => `/repos/${cfg.repo}/contents/${cfg.path.split('/').map(encodeURIComponent).join('/')}`;

async function loadRemote() {
  const r = await gh(contentsUrl() + '?ref=' + encodeURIComponent(cfg.branch));
  if (r.status === 404) { sha = null; return null; }
  if (!r.ok) throw new Error('Could not read data file: ' + await errMsg(r));
  const j = await r.json(); sha = j.sha;
  let content = j.content;
  if (!content) {
    const b = await gh(`/repos/${cfg.repo}/git/blobs/${j.sha}`);
    if (!b.ok) throw new Error('Could not read data file: ' + await errMsg(b));
    content = (await b.json()).content;
  }
  return JSON.parse(b64decode(content));
}
async function refreshSha() {
  const r = await gh(contentsUrl() + '?ref=' + encodeURIComponent(cfg.branch));
  if (r.status === 404) { sha = null; return; }
  if (!r.ok) throw new Error(await errMsg(r));
  sha = (await r.json()).sha;
}
async function saveRemote(force) {
  if (!state || !cfg) return;
  if (saving) { scheduleSave(); return; }
  if (conflict && !force) return;
  clearTimeout(saveTimer);
  saving = true; setStatus('saving');
  const myRev = rev;
  try {
    if (force) await refreshSha();
    const body = {message: 'Update R&R tracker ' + new Date().toISOString(), content: b64encode(JSON.stringify(state, null, 1)), branch: cfg.branch};
    if (sha) body.sha = sha;
    const r = await gh(contentsUrl(), {method: 'PUT', body: JSON.stringify(body)});
    if (!r.ok) {
      const m = await errMsg(r);
      if (r.status === 409 || (r.status === 422 && /sha/i.test(m))) { conflict = true; setStatus('conflict'); return; }
      throw new Error(m);
    }
    const j = await r.json(); sha = j.content.sha; conflict = false;
    savedRev = myRev; lastSaved = new Date();
    if (rev === savedRev) { writeCache(false); setStatus('saved'); } else scheduleSave();
  } catch (e) {
    setStatus('error', e.message);
  } finally { saving = false; }
}
function scheduleSave() { clearTimeout(saveTimer); saveTimer = setTimeout(() => saveRemote(), 2000); }
function markDirty() {
  rev++; if (state) state.updated = Date.now();
  writeCache(true); if (!conflict) setStatus('pending');
  scheduleSave();
}
function touch() { const p = curProject(); if (p) p.updated = Date.now(); markDirty(); }
function writeCache(dirty) {
  try { localStorage.setItem(LS_CACHE, JSON.stringify({key: cfg.repo + '/' + cfg.path, dirty, state})); } catch (e) {}
}
function readCache() { try { return JSON.parse(localStorage.getItem(LS_CACHE) || 'null'); } catch (e) { return null; } }
function setStatus(kind, msg) {
  const el = $('#syncPill'); if (!el) return;
  el.className = 'pill ' + kind;
  const t = lastSaved ? lastSaved.toLocaleTimeString([], {hour: 'numeric', minute: '2-digit'}) : '';
  el.textContent = {saved: 'Saved' + (t ? ' ' + t : ''), pending: 'Unsaved changes', saving: 'Saving...', error: 'Save failed. Retry', conflict: 'Conflict. Resolve'}[kind] || kind;
  el.title = msg || (kind === 'saved' ? 'Synced to ' + cfg.repo + '/' + cfg.path : '');
}
window.addEventListener('beforeunload', e => { if (state && (rev !== savedRev || saving)) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- lock / unlock ---------- */
function readCfg() {
  try { return JSON.parse(sessionStorage.getItem(LS_CFG) || localStorage.getItem(LS_CFG) || 'null'); } catch (e) { return null; }
}
function showLock(msg) {
  $('#app').classList.add('hidden'); $('#lock').classList.remove('hidden');
  let pub = {}; try { pub = JSON.parse(localStorage.getItem(LS_PUB) || '{}'); } catch (e) {}
  if (pub.repo) $('#lkRepo').value = pub.repo;
  if (pub.path) $('#lkPath').value = pub.path;
  if (pub.branch !== undefined) $('#lkBranch').value = pub.branch;
  $('#lkErr').textContent = msg || '';
  $('#lkBtn').disabled = false; $('#lkBtn').textContent = 'Unlock';
  setTimeout(() => ($('#lkRepo').value ? $('#lkToken') : $('#lkRepo')).focus(), 0);
}
async function unlock() {
  const r = await gh(`/repos/${cfg.repo}`);
  if (r.status === 401) throw new Error('GitHub rejected this token. It may be mistyped or expired.');
  if (r.status === 404 || r.status === 403) throw new Error('Repository not found, or this token has no access to it.');

/* ---------- modal / toast / download ---------- */
function modal({title, body, buttons}) {
  return new Promise(res => {
    const wrap = document.createElement('div'); wrap.className = 'modal-bg';
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><div class="modal-body">${body || ''}</div>
      <div class="modal-btns">${buttons.map((b, i) => `<button type="button" data-i="${i}" class="${b.cls || ''}">${esc(b.label)}</button>`).join('')}</div></div>`;
    document.body.appendChild(wrap);
    const close = v => { wrap.remove(); res(v); };
    wrap.addEventListener('click', e => {
      const b = e.target.closest('[data-i]');
      if (b) { const btn = buttons[+b.dataset.i]; close(typeof btn.value === 'function' ? btn.value(wrap) : btn.value); }
      else if (e.target === wrap) close(null);
    });
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Escape') close(null);
      if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
        const pi = buttons.findIndex(b => (b.cls || '').includes('primary'));
        if (pi >= 0) { e.preventDefault(); wrap.querySelector(`[data-i="${pi}"]`).click(); }
      }
    });
    setTimeout(() => { const f = wrap.querySelector('input,select,textarea') || wrap.querySelector('.primary'); if (f) f.focus(); }, 0);
  });
}

function parseCSV(text) {

  const rows = []; let row = [], f = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === delim) { row.push(f); f = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(f); rows.push(row); row = []; f = ''; }
    else f += c;
  }
  if (f !== '' || row.length) { row.push(f); rows.push(row); }

  if (/action|change|revision|todo/.test(n)) return 'action';
  if (/comment|critique|concern|request|feedback/.test(n)) return 'comment';
  if (/weight|difficult|effort|level/.test(n)) return 'weight';
  if (/section|location|area|part/.test(n)) return 'section';
  if (/reviewer|^rev|^r#?$/.test(n)) return 'reviewer';
  if (/complete|done|status|check|finished/.test(n)) return 'done';

  return null;
}

  if (!rows.length) return {edits: [], header: false, fields: []};
  const m = rows[0].map(mapHeader);
  const header = new Set(m.filter(Boolean)).size >= 2;
  const map = header ? m : FIELD_ORDER, data = header ? rows.slice(1) : rows;
  let next = startNum; const edits = [];
  for (const r of data) {

    map.forEach((f, i) => {

      const v = String(r[i]).trim();
      if (f === 'num') { const x = parseFloat(v.replace(/[^0-9.]/g, '')); e.num = isNaN(x) ? null : x; }

const CSV_HEAD = ['Edit #', 'Reviewer', 'Section', 'Weight', 'Reviewer comment', 'Action taken', 'Response', 'Complete'];
function editsToCSV(edits) {
  return '\uFEFF' + [CSV_HEAD].concat(edits.slice().sort(cmpNum).map(e => [e.num ?? '', e.reviewer, e.section, W(e), e.comment, e.action, e.response, e.done ? 'yes' : 'no']))
    .map(r => r.map(csvField).join(',')).join('\r\n');
}
async function importCSVText(p, text) {
  const maxNum = p.edits.reduce((m, e) => Math.max(m, isFinite(numOf(e)) ? numOf(e) : 0), 0);
  const res = rowsToEdits(parseCSV(text), maxNum + 1);
  if (!res.edits.length) { toast('No rows found in that file.'); return; }
  const fieldNames = {num: 'edit #', reviewer: 'reviewer', section: 'section', weight: 'weight', comment: 'comment', action: 'action', response: 'response', done: 'complete'};
  const body = `<p>Found <b>${res.edits.length}</b> edit${res.edits.length === 1 ? '' : 's'}.</p>
    <p class="muted">${res.header ? 'Columns matched: ' + res.fields.map(f => fieldNames[f]).join(', ') + '.' : 'No header row recognized, so columns were read in template order.'}
    ${res.fields.includes('weight') ? '' : ' No weight column; every edit gets weight 2.'}</p>`;
  const buttons = [{label: 'Cancel', value: null}];
  if (p.edits.length) buttons.push({label: `Replace all ${p.edits.length}`, value: 'replace', cls: 'danger'});
  buttons.push({label: p.edits.length ? 'Append' : 'Import', value: 'append', cls: 'primary'});
  const v = await modal({title: 'Import edits', body, buttons});
  if (!v) return;
  if (v === 'replace') {
    const sure = await confirmModal('Replace existing edits?', `This removes the ${p.edits.length} current edits, including any responses you wrote. Export a CSV first if you want a copy.`, 'Replace');
    if (!sure) return;
    p.edits = rowsToEdits(parseCSV(text), 1).edits;
  } else p.edits = p.edits.concat(res.edits);
  touch(); renderProject(p); toast(`Imported ${res.edits.length} edits.`);
}

/* ---------- response letter ---------- */
function paras(t) { return String(t || '').split(/\n\s*\n/).map(s => s.replace(/\s+$/, '')).filter(s => s.trim()); }
function letterModel(p) {
  const o = p.letter;
  const items = p.edits.slice().sort((a, b) => cmpRev(a.reviewer, b.reviewer) || cmpNum(a, b));
  const groups = []; let seq = 0;
  for (const e of items) {
    const key = String(e.reviewer || '').trim().toLowerCase();
    let g = groups[groups.length - 1];
    if (!g || g.key !== key) { g = {key, label: revLabel(e.reviewer), items: []}; groups.push(g); }
    seq++;
    const n = o.numbering === 'seq' ? seq : o.numbering === 'reviewer' ? g.items.length + 1 : (isFinite(numOf(e)) ? numOf(e) : '?');
    g.items.push({n, e});
  }
  return groups;
}
function itemLabel(o, it) { return `${o.commentLabel || 'Comment'} ${it.n}${o.includeSection && String(it.e.section || '').trim() ? ' (' + it.e.section.trim() + ')' : ''}.`; }
function letterHTML(p, forClipboard) {
  const o = p.letter, groups = letterModel(p);
  const P = 'style="margin:0 0 12pt"', IND = 'style="margin:0 0 6pt 0.5in"', IND2 = 'style="margin:0 0 14pt 0.5in"';
  const t = s => esc(s).replace(/\n/g, '<br>');
  const pend = forClipboard ? '[Response pending]' : '<span class="pending">[Response pending]</span>';
  let h = paras(p.intro).map(x => `<p ${P}>${t(x)}</p>`).join('');
  if (!p.intro.trim() && !forClipboard) h += `<p class="empty-l">Your introduction will appear here.</p>`;
  for (const g of groups) {
    h += `<h3 style="font-weight:bold;margin:18pt 0 8pt">${esc(g.label)}</h3>`;
    for (const it of g.items) {
      const resp = String(it.e.response || '').trim() ? t(it.e.response.trim()) : pend;
      if (o.includeComment) {
        h += `<p ${IND}><b>${esc(itemLabel(o, it))}</b> <i>${t(String(it.e.comment || '').trim())}</i></p>`;
        h += `<p ${IND2}><b>${esc(o.responseLabel || 'Response')}:</b> ${resp}</p>`;
      } else h += `<p ${IND2}><b>${esc(itemLabel(o, it))}</b> ${resp}</p>`;
    }
  }
  if (!groups.length && !forClipboard) h += `<p class="empty-l">No edits yet.</p>`;
  h += paras(p.conclusion).map(x => `<p ${P}>${t(x)}</p>`).join('');
  if (!p.conclusion.trim() && !forClipboard) h += `<p class="empty-l">Your conclusion will appear here.</p>`;
  return h;
}
function letterText(p) {
  const o = p.letter; const out = [];
  paras(p.intro).forEach(x => out.push(x));
  for (const g of letterModel(p)) {
    out.push(g.label);
    for (const it of g.items) {
      const resp = String(it.e.response || '').trim() || '[Response pending]';
      if (o.includeComment) { out.push(itemLabel(o, it) + ' ' + String(it.e.comment || '').trim()); out.push((o.responseLabel || 'Response') + ': ' + resp); }
      else out.push(itemLabel(o, it) + ' ' + resp);
    }
  }
  paras(p.conclusion).forEach(x => out.push(x));
  return out.join('\n\n');
}
function rtfEsc(s) {
  s = String(s ?? ''); let out = '';
  for (let i = 0; i < s.length; i++) {
    const c = s.charCodeAt(i);
    if (c === 92) out += '\\\\'; else if (c === 123) out += '\\{'; else if (c === 125) out += '\\}';
    else if (c === 10) out += '\\line '; else if (c === 13) continue; else if (c === 9) out += '\\tab ';
    else if (c < 128) out += s[i];
    else out += '\\u' + (c > 32767 ? c - 65536 : c) + '?';
  }
  return out;
}
function letterRTF(p) {
  const o = p.letter;
  const PAR = '\\pard\\plain\\f0\\fs24\\sl276\\slmult1';
  let r = '{\\rtf1\\ansi\\ansicpg1252\\deff0\\uc1\n{\\fonttbl{\\f0\\froman\\fcharset0 Times New Roman;}}\n' +
    '\\paperw12240\\paperh15840\\margl1440\\margr1440\\margt1440\\margb1440\\widowctrl\n';
  paras(p.intro).forEach(x => { r += `${PAR}\\sa240 ${rtfEsc(x)}\\par\n`; });
  for (const g of letterModel(p)) {
    r += `${PAR}\\keepn\\sb240\\sa160 {\\b ${rtfEsc(g.label)}}\\par\n`;
    for (const it of g.items) {
      const resp = rtfEsc(String(it.e.response || '').trim() || '[Response pending]');
      if (o.includeComment) {
        r += `${PAR}\\li720\\sa120\\keepn {\\b ${rtfEsc(itemLabel(o, it))}} {\\i ${rtfEsc(String(it.e.comment || '').trim())}}\\par\n`;
        r += `${PAR}\\li720\\sa280 {\\b ${rtfEsc(o.responseLabel || 'Response')}:} ${resp}\\par\n`;
      } else r += `${PAR}\\li720\\sa280 {\\b ${rtfEsc(itemLabel(o, it))}} ${resp}\\par\n`;
    }
  }
  paras(p.conclusion).forEach(x => { r += `${PAR}\\sa240 ${rtfEsc(x)}\\par\n`; });
  return r + '}';
}
function renderLetterTab(p) {
  const o = p.letter;
  $('#tabBody').innerHTML = `<div class="letter-grid">
    <div class="letter-controls">
      <div><span class="fl">Introduction</span><textarea data-lf="intro" placeholder="Dear Dr. ...,&#10;&#10;Thank you for the opportunity to revise ...">${esc(p.intro)}</textarea></div>
      <fieldset class="opts"><legend>Letter format</legend>
        <label class="chkline"><input type="checkbox" data-lo="includeComment" ${o.includeComment ? 'checked' : ''}> Quote each reviewer comment above my response</label>
        <label class="chkline"><input type="checkbox" data-lo="includeSection" ${o.includeSection ? 'checked' : ''}> Note the section of the paper</label>
        <label style="display:flex;gap:8px;align-items:center">Numbering <select data-lo="numbering">
          ${[['edit', 'Use edit numbers'], ['seq', 'Sequential, 1 to N'], ['reviewer', 'Restart for each reviewer']].map(([v, l]) => `<option value="${v}" ${o.numbering === v ? 'selected' : ''}>${l}</option>`).join('')}
        </select></label>
        <div class="two"><label>Comment label<input data-lo="commentLabel" value="${esc(o.commentLabel)}"></label><label>Response label<input data-lo="responseLabel" value="${esc(o.responseLabel)}"></label></div>
      </fieldset>
      <div><span class="fl">Conclusion</span><textarea data-lf="conclusion" placeholder="We thank the reviewers again ...&#10;&#10;Sincerely,">${esc(p.conclusion)}</textarea></div>
      <div class="btns"><button class="primary" data-act="exportRtf">Export .rtf</button><button data-act="copyLetter">Copy formatted text</button></div>
      <div id="pendingNote"></div>
      <p class="muted" style="font-size:13px;margin:0">Edit responses in the Edits tab; the letter rebuilds itself. Blank lines in the introduction and conclusion start new paragraphs.</p>
    </div>
    <div class="paper" id="preview"></div></div>`;
  renderPreview(p);
  requestAnimationFrame(() => $$('#tabBody textarea').forEach(autosize));
}
function renderPreview(p) {
  if (!$('#preview')) return;
  $('#preview').innerHTML = letterHTML(p, false);
  const pend = p.edits.filter(e => !String(e.response || '').trim()).sort(cmpNum);
  $('#pendingNote').innerHTML = pend.length ? `<div class="note">${pend.length} edit${pend.length === 1 ? ' has' : 's have'} no response yet: ${pend.slice(0, 25).map(e => '#' + (e.num ?? '?')).join(', ')}${pend.length > 25 ? ', ...' : ''}</div>` : '';
}

/* ---------- events ---------- */
document.addEventListener('click', async ev => {
  const el = ev.target.closest('[data-act]'); if (!el || !state) return;
  const act = el.dataset.act, p = curProject();
  if (act === 'open' && ev.target.closest('select,button,label')) return;
  switch (act) {
    case 'home': go('#/'); break;
    case 'open': go('#/p/' + el.dataset.id); break;
    case 'tab': go('#/p/' + p.id + (el.dataset.tab === 'letter' ? '/letter' : '')); break;
    case 'newFolder': {
      const n = await promptModal('New folder', 'Folder name');
      if (n) { state.folders.push({id: uid(), name: n}); markDirty(); render(); }
      break;
    }
    case 'renameFolder': {
      const f = state.folders.find(x => x.id === el.dataset.id);
      const n = await promptModal('Rename folder', 'Folder name', f.name);
      if (n) { f.name = n; markDirty(); render(); }
      break;
    }
    case 'delFolder': {
      const f = state.folders.find(x => x.id === el.dataset.id);
      const k = state.projects.filter(x => x.folderId === f.id).length;
      if (await confirmModal('Delete folder?', `Delete "${esc(f.name)}"? ${k ? `Its ${k} project${k === 1 ? '' : 's'} will move to Unfiled; none are deleted.` : 'It is empty.'}`)) {
        state.projects.forEach(x => { if (x.folderId === f.id) x.folderId = null; });
        state.folders = state.folders.filter(x => x !== f); markDirty(); render();
      }
      break;
    }
    case 'toggleFolder': ui.collapsed[el.dataset.id] = !ui.collapsed[el.dataset.id]; render(); break;
    case 'newProject': {
      const fopts = `<option value="">Unfiled</option>` + state.folders.slice().sort((a, b) => cmpStr(a.name, b.name)).map(f => `<option value="${f.id}" ${el.dataset.folder === f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('');
      const v = await modal({title: 'New project', body: `<label>Project name<input id="npName" placeholder="Short title of the manuscript"></label>
        <label>Journal (optional)<input id="npJournal"></label><label>Folder<select id="npFolder" style="width:100%">${fopts}</select></label>`,
        buttons: [{label: 'Cancel', value: null}, {label: 'Create', cls: 'primary', value: w => ({name: w.querySelector('#npName').value.trim(), journal: w.querySelector('#npJournal').value.trim(), folderId: w.querySelector('#npFolder').value})}]});
      if (v && v.name) { const np = newProject(v.name, v.folderId, v.journal); state.projects.push(np); markDirty(); go('#/p/' + np.id); }
      else if (v) toast('A project needs a name.');
      break;
    }
    case 'delProject': {
      const q = state.projects.find(x => x.id === el.dataset.id);
      if (await confirmModal('Delete project?', `Delete "${esc(q.name)}" and its ${q.edits.length} edits? The previous version stays in your data repository's commit history.`)) {
        state.projects = state.projects.filter(x => x !== q); markDirty(); render();
      }
      break;
    }
    case 'addEdit': {
      const maxNum = p.edits.reduce((m, e) => Math.max(m, isFinite(numOf(e)) ? numOf(e) : 0), 0);
      const last = p.edits.slice().sort(cmpNum).pop();
      const e = newEdit({num: Math.floor(maxNum) + 1, reviewer: last ? last.reviewer : '1'});
      p.edits.push(e); ui.fRev = ui.fSec = ui.fStat = '';
      touch(); refreshLists(p); renderRows(p); renderProgress(p);
      $('.tabs button').textContent = `Edits (${p.edits.length})`;
      const row = document.querySelector(`.row[data-id="${e.id}"]`);
      if (row) { row.scrollIntoView({behavior: 'smooth', block: 'center'}); row.classList.add('flash'); setTimeout(() => row.classList.remove('flash'), 1200); row.querySelector('[data-ef=comment]').focus({preventScroll: true}); }
      break;
    }
    case 'delEdit': {
      const row = el.closest('.row'), e = findEdit(row.dataset.id);
      if (await confirmModal('Delete edit?', `Delete edit #${esc(e.num ?? '?')}${e.comment ? ': "' + esc(e.comment.slice(0, 80)) + (e.comment.length > 80 ? '...' : '') + '"' : ''}?`)) {
        p.edits = p.edits.filter(x => x !== e); touch(); refreshLists(p); renderRows(p); renderProgress(p);
        $('.tabs button').textContent = `Edits (${p.edits.length})`;
      }
      break;
    }
    case 'weight': {
      const row = el.closest('.row'), e = findEdit(row.dataset.id), n = +el.dataset.w;
      e.weight = n; row.dataset.w = n; row.querySelectorAll('.wt button').forEach(b => b.classList.toggle('on', +b.dataset.w === n));
      touch(); renderProgress(p); break;
    }
    case 'mode': p.progressMode = el.dataset.mode; touch(); renderProgress(p); break;
    case 'dir': ui.dir *= -1; el.textContent = ui.dir === 1 ? '↑ Asc' : '↓ Desc'; renderRows(p); break;
    case 'importCsv': $('#csvFile').value = ''; $('#csvFile').click(); break;
    case 'exportCsv': download(`${slug(p.name)}_edits_${today()}.csv`, editsToCSV(p.edits), 'text/csv;charset=utf-8'); break;
    case 'template': download('rnr-edits-template.csv', '\uFEFF' + CSV_HEAD.map(csvField).join(',') + '\r\n' +
      ['1', '1', 'Introduction', '2', 'The authors should clarify their contribution to the literature.', 'Rewrote final two paragraphs of intro', 'We have clarified our contribution on page 3.', 'no'].map(csvField).join(','), 'text/csv;charset=utf-8'); break;
    case 'exportRtf': download(`${slug(p.name)}_response-letter_${today()}.rtf`, letterRTF(p), 'application/rtf'); break;
    case 'copyLetter': {
      try {
        if (window.ClipboardItem) await navigator.clipboard.write([new ClipboardItem({'text/html': new Blob([`<div style="font-family:'Times New Roman',serif;font-size:12pt">${letterHTML(p, true)}</div>`], {type: 'text/html'}), 'text/plain': new Blob([letterText(p)], {type: 'text/plain'})})]);
        else await navigator.clipboard.writeText(letterText(p));
        toast('Letter copied with formatting.');
      } catch (e) { toast('Copy failed. Use Export .rtf instead.'); }
      break;
    }
    case 'backup': download(`rnr-tracker-backup_${today()}.json`, JSON.stringify(state, null, 1), 'application/json'); break;
    case 'restore': $('#jsonFile').value = ''; $('#jsonFile').click(); break;
    case 'lock': lockApp(); break;
    case 'sync': {
      const cls = el.className;
      if (cls.includes('conflict')) {
        const v = await modal({title: 'Data changed elsewhere', body: '<p>The data file on GitHub changed after this page loaded, probably from another device or tab.</p><p><b>Load GitHub version</b> discards changes made here since the last save. <b>Overwrite</b> replaces the GitHub version with this one.</p>',
          buttons: [{label: 'Cancel', value: null}, {label: 'Load GitHub version', value: 'load'}, {label: 'Overwrite GitHub', value: 'force', cls: 'danger'}]});
        if (v === 'force') saveRemote(true);
        if (v === 'load') { try { state = normalizeState(await loadRemote()); conflict = false; savedRev = rev; writeCache(false); setStatus('saved'); route(); } catch (e) { toast(e.message, 5000); } }
      } else if (cls.includes('error') || cls.includes('pending')) saveRemote();
      break;
    }
  }
});

document.addEventListener('input', ev => {
  const t = ev.target; if (!state) return;
  if (t.tagName === 'TEXTAREA') autosize(t);
  const p = curProject();
  if (t.dataset.ef && t.dataset.ef !== 'done') {
    const e = findEdit(t.closest('.row').dataset.id); if (!e) return;
    if (t.dataset.ef === 'num') e.num = t.value === '' ? null : Number(t.value);
    else e[t.dataset.ef] = t.value;
    touch();
  } else if (t.dataset.pf) {
    p[t.dataset.pf] = t.value; touch();
    if (t.dataset.pf === 'name') $('#crumb').textContent = '/ ' + t.value;
  } else if (t.dataset.lf) { p[t.dataset.lf] = t.value; touch(); renderPreview(p); }
  else if (t.dataset.lo && t.type !== 'checkbox' && t.tagName !== 'SELECT') { p.letter[t.dataset.lo] = t.value; touch(); renderPreview(p); }
  else if (t.id === 'blend') { p.blend = +t.value; touch(); renderProgress(p); }
});

document.addEventListener('change', async ev => {
  const t = ev.target; if (!state) return;
  const p = curProject();
  if (t.dataset.ef === 'done') {
    const row = t.closest('.row'), e = findEdit(row.dataset.id);
    e.done = t.checked; row.classList.toggle('done', t.checked); touch(); renderProgress(p);
  } else if (t.dataset.ef === 'reviewer' || t.dataset.ef === 'section') { refreshLists(p); renderProgress(p); }
  else if (t.dataset.lo && (t.type === 'checkbox' || t.tagName === 'SELECT')) { p.letter[t.dataset.lo] = t.type === 'checkbox' ? t.checked : t.value; touch(); renderPreview(p); }
  else if (t.dataset.move !== undefined) { const q = state.projects.find(x => x.id === t.dataset.move); q.folderId = t.value || null; markDirty(); render(); }
  else if (t.id === 'sortSel') { ui.sort = t.value; renderRows(p); }
  else if (t.id === 'fRev') { ui.fRev = t.value; renderRows(p); }
  else if (t.id === 'fSec') { ui.fSec = t.value; renderRows(p); }
  else if (t.id === 'fStat') { ui.fStat = t.value; renderRows(p); }
  else if (t.id === 'bdSel') { ui.breakdown = t.value; renderProgress(p); }
  else if (t.id === 'csvFile' && t.files[0] && p) { importCSVText(p, await t.files[0].text()); }
  else if (t.id === 'jsonFile' && t.files[0]) {
    try {
      const data = JSON.parse(await t.files[0].text());
      if (!data || !Array.isArray(data.projects)) throw new Error('Not an R&R Tracker backup.');
      if (await confirmModal('Restore backup?', `Replace everything here with the backup (${data.projects.length} projects)? The current version stays in your data repository's commit history.`, 'Restore')) {
        state = normalizeState(data); markDirty(); go('#/');
      }
    } catch (e) { toast('Restore failed: ' + e.message, 5000); }
  }
});

/* ---------- init ---------- */
(async function init() {
  const saved = readCfg();
  if (saved && saved.token) {
    cfg = saved;
    $('#lock').classList.add('hidden');
    try { await unlock(); } catch (e) { cfg = null; showLock(e.message); }
  } else showLock();
})();
</script>
</body>
</html>
